name: Optional upstream contract check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check recorded producer fixture
        run: python scripts/fm_contract_check.py --home tests/fixtures/home
